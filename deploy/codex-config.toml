model = "gpt-6-luna"
model_reasoning_effort = "high"
approval_policy = "never"
default_permissions = "telegram"
web_search = "live"

[features]
network_proxy = false

[agents]
enabled = false

[permissions.telegram.workspace_roots]
"/home/maksym/projects" = true

[permissions.telegram.filesystem]
glob_scan_max_depth = 7
":minimal" = "read"
":slash_tmp" = "write"
":tmpdir" = "write"
"/home/maksym/projects" = "write"
"/home/maksym/projects/codex-telegram-agent" = "read"
"/home/maksym/projects/codex-root-broker" = "read"
"/home/maksym/projects/luxpower-automation" = "read"
"/home/maksym/projects/luxpower-telegram-bot" = "read"
"/home/maksym/projects/.codex" = "deny"
"/home/maksym/projects/.agents" = "deny"
"/home/maksym/projects/luxpower-automation/state" = "read"
"/home/maksym/projects/luxpower-telegram-bot/state" = "read"
"/home/maksym/projects/luxpower-telegram-bot/state/bot.sqlite3" = "deny"
"/home/maksym/projects/luxpower-telegram-bot/state/codex.sock" = "deny"
"/home/maksym/projects/luxpower-telegram-bot/config.toml" = "deny"
"/home/maksym/.codex/auth.json" = "deny"
"/home/maksym/.codex/config.toml" = "deny"
"/home/maksym/.codex/sessions" = "deny"
"/home/maksym/.codex/state_5.sqlite" = "deny"
"/home/maksym/.codex/packages/standalone" = "read"
"/home/maksym/.local/share/codex-telegram" = "deny"
"/home/maksym/.ssh" = "deny"
"/home/maksym/.aws" = "deny"
"/home/maksym/.config" = "deny"
"/home/maksym/.git-credentials" = "deny"
"/home/maksym/.netrc" = "deny"
"/home/maksym/.npmrc" = "deny"
"/home/maksym/.pypirc" = "deny"
"/home/maksym/.bash_history" = "deny"
"/home/maksym/.python_history" = "deny"
"/home/maksym/.vscode-server" = "deny"
"/home/maksym/.local/share/keyrings" = "deny"
# Local runtime sockets are available, except private approval/manager channels.
"/run" = "read"
# host_system provides user-service operations without exposing manager setters.
"/run/user" = "deny"
"/run/codex-root-broker" = "deny"
"/run/credentials" = "deny"
"/proc" = "deny"

[permissions.telegram.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/*.env" = "deny"
"**/.env.*" = "deny"
"**/config.toml" = "deny"
"**/auth.json" = "deny"
"**/credentials.json" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/bot.sqlite3*" = "deny"

[permissions.telegram.network]
enabled = true
allow_local_binding = true
